<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>What If? Lab · Phins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/css/phins.css?v=11111921">
<script src="assets/js/config.js?v=11111921"></script>
<script src="assets/js/core.js?v=11111921"></script>
<script src="assets/js/pages/whatif.js?v=11111921"></script>
<style>
.wgrid{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); align-items:start}
.wcard{background:var(--surface); border:2px solid var(--line); border-radius:20px; overflow:hidden}
.wcard.flipped{border-color:var(--pink)}
.wcard.soon{border-style:dashed; padding:16px; background:var(--surface-2)}
.wflip{width:100%; text-align:left; background:linear-gradient(135deg,var(--pink-soft),var(--yellow-soft)); border:0; padding:18px; cursor:pointer; display:flex; flex-direction:column; gap:8px; min-height:120px}
.wq{font-family:var(--f-display); font-weight:800; font-size:21px; line-height:1.2}
.whint{font:600 12.5px var(--f-mono); text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-top:auto}
.wback{padding:14px 16px 16px; display:grid; gap:10px; animation:fadein .3s ease}
@keyframes fadein{from{opacity:0; transform:rotateX(-12deg)} to{opacity:1; transform:none}}
.wfix{font-size:18px}
.wpair{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px}
.wmini{margin:0} .wmini figcaption{font:600 11.5px var(--f-mono); text-transform:uppercase; color:var(--muted); margin-bottom:3px}
.wmini svg{width:100%; height:auto; display:block}
.wn{fill:var(--surface); stroke:var(--green); stroke-width:1.2} .wnt{fill:var(--ink)}
.wh{fill:var(--pink); stroke:var(--pink); stroke-width:1.2} .wht{fill:#fff}
.wg{fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 1.5} .wgt{fill:var(--muted)}
.wlegend{font:600 12px var(--f-mono); color:var(--muted)}
.wtags{display:flex; flex-wrap:wrap; gap:6px}
.wfoot{font-family:var(--f-display); font-weight:800; color:var(--pink); text-align:center; border-top:1.5px solid var(--line); padding-top:10px}
#wfilter button{padding:0 14px; font-size:15px}
</style>
</head>
<body>
<main class="wrap" id="main" data-page="whatif" data-section="2">
  <header class="hero">
    <div class="eyebrow">Phins Playbook</div>
    <h1>The "What If?" Lab</h1>
  </header>
  <div class="numrow" id="wfilter" role="group" aria-label="Filter by tag"></div>
  <div class="wgrid" id="wgrid"></div>
</main>
</body>
</html>
